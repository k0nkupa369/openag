name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  test:
    # The private development repo runs on our self-hosted macOS runner: file confinement (sandbox-exec) and the launchd
    # service are macOS-only, so a Linux runner cannot run the full suite. The public snapshot (k0nkupa369/openag) receives
    # this file too and must never run fork pull requests on a local machine, so it keeps the GitHub-hosted macOS runner.
    runs-on: ${{ github.repository == 'k0nkupa369/open-ag' && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # pnpm comes from corepack (the packageManager pin in package.json), so a self-hosted runner needs no global pnpm.
      - run: corepack enable && corepack install && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter daemon typecheck:tests
      - run: pnpm -r test
      - run: node scripts/verify-bot-knowledge.mjs
      - run: node scripts/verify-capabilities.mjs
      - run: node scripts/verify-onboard.mjs
